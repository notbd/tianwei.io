name: CI

# pull_request covers dev (synchronize on every push); push:main covers the
# merge commit. A dev push trigger would double-run everything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A force-push supersedes the running check — don't burn minutes finishing it.
# (Also applies to main: only the latest merge's regression check matters.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Public values, not secrets: the read-only content API and the Cloudinary
    # cloud name visible in every image URL. Inlined so Dependabot and fork
    # PRs, which get no Actions secrets, can build.
    env:
      CONTENT_API_URL: https://tio.twz.app
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dllyef7is
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version read from packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Regression check only — Vercel performs the real deploy build.
      # Hits the public read-only content API at build time (SSG).
      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e
